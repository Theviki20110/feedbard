[project]
name = "feedbard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.69.0",
    "babel>=2.18.0",
    "beautifulsoup4>=4.15.0",
    "boto3>=1.40.0",
    "feedparser>=6.0.14",
    "jinja2>=3.1.6",
    "jiwer>=3.0.0",
    "langcodes>=3.5.1",
    "language-data>=1.4.0",
    "lxml>=6.1.1",
    "mutagen>=1.48.1",
    "pillow>=12.3.0",
    "python-dotenv>=1.0.0",
    "readability-lxml>=0.8.1",
    "requests>=2.32.0",
    "substack-api>=1.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP042"]  # str+Enum kept for JSON-serialization compat

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
