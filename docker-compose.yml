services:
  feedbard:
    image: ghcr.io/theviki20110/feedbard:latest
    # Local edits win over the published image when you run `--build`.
    build: .
    env_file: .env
    volumes:
      - ${DATA_VOLUME}:/app/data
      # Point the Audiobookshelf container at this same path, as a Book library.
      - ${LIBRARY_VOLUME}:/app/library
    restart: unless-stopped
